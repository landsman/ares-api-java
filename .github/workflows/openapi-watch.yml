name: openapi-watch

# Once a month, compares ARES's OpenAPI document with spec/ares-openapi.json and, when it changed, opens one issue
# (or updates the open one) saying what moved, with a prompt to comment for Claude to handle it. Nothing else would
# notice: the register changes its API without a changelog, and this library has no caller that reads every field.
on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the issue when the document changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/openapi-watch.sh report
